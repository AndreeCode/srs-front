name: Auditoria de dependencias

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bun-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Instalar exactamente lo del lockfile
        run: bun install --frozen-lockfile
      - name: Dependencias de produccion (cualquier severidad)
        run: bun audit --prod
      - name: Todas las dependencias (solo high y critical)
        # GHSA-mrhx-c7xc-m3w5: zod@3 solo lo usa la CLI de shadcn (devDependency, nunca llega al
        # bundle de la app). Quitar este --ignore cuando shadcn actualice su dependencia.
        run: bun audit --audit-level=high --ignore=GHSA-mrhx-c7xc-m3w5
